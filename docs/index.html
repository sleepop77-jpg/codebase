<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VibeBridge · Khaki</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="vb-studio-shell">
        <!-- LEFT: File Tree -->
        <aside class="sk-left">
            <div class="sk-search">Search project…</div>
            <div class="sk-tree-toolbar">
                <button id="btn-refresh">⟳ Refresh</button>
                <button id="btn-push" disabled>Push staged (0)</button>
            </div>
            <div class="sk-tree" id="file-tree">
                <div class="sk-tree-empty">Connect a repo to start.</div>
            </div>
            <div class="sk-menu">
                <button id="btn-options">Options</button>
                <button id="btn-wipe" style="color:#b3402e">☢ Wipe data</button>
            </div>
            <div class="sk-legal">Khaki Edition · v1.0</div>
        </aside>

        <!-- CENTER: Editor & Chat -->
        <section class="sk-center">
            <div class="sk-tabs">
                <div class="sk-tab on" data-view="github">github</div>
                <div class="sk-tab" data-view="chat">chat</div>
            </div>
            <div class="sk-body" id="sk-body">
                <!-- Editor Tabs -->
                <div class="sk-editor-tabs" id="editor-tabs" style="display:none;"></div>
                
                <!-- Main Content Area -->
                <div id="main">
                    <!-- Chat View -->
                    <div id="chat-view">
                        <div id="flow"></div>
                    </div>
                    
                    <!-- Editor View -->
                    <div id="editor-view" style="display:none; flex:1; position:relative;">
                        <textarea id="code-editor" class="sk-code" spellcheck="false" placeholder="// Select a file from the left..."></textarea>
                    </div>

                    <!-- Composer -->
                    <div id="composerwrap">
                        <div id="composer">
                            <textarea id="input" rows="1" placeholder="Message VibeBridge…"></textarea>
                            <div class="crow">
                                <button id="paste" class="pill">Paste</button>
                                <span class="spacer"></span>
                                <button id="send" class="sendbtn" disabled>↑</button>
                            </div>
                        </div>
                        <div class="footnote">tokens stay in this tab · payloads parse locally</div>
                    </div>
                </div>
            </div>
        </section>

        <!-- RIGHT: Utilities -->
        <aside class="sk-right">
            <div class="sk-card">
                <h4>GitHub credentials</h4>
                <div class="sk-row"><span>Repo</span><span class="sk-val" id="val-repo">—</span></div>
                <div class="sk-row"><span>PAT</span><span class="sk-val" id="val-pat">—</span></div>
                <button class="sk-btn" id="btn-copy-token">Copy token</button>
            </div>
            <button class="sk-btn solid" id="btn-connect">⚡ Connect GitHub</button>
            <div class="sk-card">
                <h4>How to use</h4>
                <div class="sk-steps">
                    <b>1.</b> Connect your GitHub repo.<br>
                    <b>2.</b> Ask your AI for a VibeBridge payload.<br>
                    <b>3.</b> Paste it in the chat.<br>
                    <b>4.</b> Review and push.
                </div>
            </div>
        </aside>
    </div>

    <!-- Hidden inputs for logic -->
    <input type="hidden" id="pat">
    <input type="hidden" id="repo">
    <input type="hidden" id="branch" value="main">

    <script src="github.js"></script>
    <script src="app.js"></script>
</body>
</html>
