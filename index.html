<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>If Then AI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar: Logic Builder -->
        <aside class="sidebar">
            <div class="brand">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
                <span>If Then AI</span>
            </div>
            
            <div class="logic-block">
                <label>IF (Trigger)</label>
                <select id="trigger-type">
                    <option value="time">Time / Schedule</option>
                    <option value="webhook">Webhook Received</option>
                    <option value="input">User Input</option>
                </select>
                <input type="text" id="trigger-val" placeholder="e.g. Every day at 9am">
            </div>

            <div class="logic-block">
                <label>THEN (Action)</label>
                <select id="action-type">
                    <option value="ai_generate">Generate AI Content</option>
                    <option value="send_email">Send Email</option>
                    <option value="push_github">Push to GitHub</option>
                </select>
                <textarea id="action-val" placeholder="e.g. Write a daily standup summary based on my commits"></textarea>
            </div>

            <button id="build-btn" class="primary-btn">Build Logic</button>
            
            <div class="history">
                <h4>Recent Runs</h4>
                <div id="history-list">
                    <div class="empty-state">No logic built yet.</div>
                </div>
            </div>
        </aside>

        <!-- Main: AI Chat & Output -->
        <main class="main-panel">
            <header class="top-bar">
                <div class="status">System Ready</div>
                <button id="clear-chat" class="ghost-btn">Clear Context</button>
            </header>

            <div class="chat-area" id="chat-flow">
                <div class="msg ai">
                    <div class="bubble">
                        Welcome to <strong>If Then AI</strong>. I help you build automation logic.<br><br>
                        1. Define a <strong>Trigger</strong> (IF) on the left.<br>
                        2. Define an <strong>Action</strong> (THEN).<br>
                        3. Click <strong>Build Logic</strong> and I will generate the executable payload for you.
                    </div>
                </div>
            </div>

            <div class="composer">
                <textarea id="user-input" placeholder="Ask me to refine your logic..."></textarea>
                <button id="send-btn" class="send-btn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                </button>
            </div>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
